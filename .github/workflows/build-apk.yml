name: Build RoyaleVision Auto v5.1 APK

on:
  push:
    branches: [ royalevision-auto-v5-1-bugfix ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Restore release signing key
        run: base64 --decode app/release-key.jks.b64 > app/release-key.jks

      - name: Build signed release APK
        run: gradle --no-daemon clean assembleRelease

      - name: Prepare APK
        run: cp app/build/outputs/apk/release/app-release.apk RoyaleVision-Auto-v5.1.apk

      - name: Verify APK package and signatures
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging RoyaleVision-Auto-v5.1.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 RoyaleVision-Auto-v5.1.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs RoyaleVision-Auto-v5.1.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: RoyaleVision-Auto-v5.1-APK
          path: RoyaleVision-Auto-v5.1.apk
          if-no-files-found: error

      - name: Install and launch on Android 15 emulator
        timeout-minutes: 8
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r RoyaleVision-Auto-v5.1.apk
            adb shell am start -W -n com.huseyn.elixircollector/.AutoMainActivity
            adb shell dumpsys package com.huseyn.elixircollector | grep -E "versionName|versionCode"
