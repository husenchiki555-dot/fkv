name: Party Charades PR Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-charades:
    if: ${{ startsWith(github.head_ref, 'charades') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Ensure Android SDK 35
        run: yes | sdkmanager --licenses >/dev/null || true; sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Diagnose and unpack Charades bundles
        shell: bash
        run: |
          set +e
          mkdir -p charades/app/src/main/java/com/partycharades/offline charades/app/src/main/assets decoded-charades
          : > decoded-charades/bundle-status.txt
          unpack() {
            src="$1"; dst="$2"; label="$3"
            tmp="/tmp/${label}.gz"
            if base64 -d "$src" > "$tmp" 2>/tmp/${label}.b64.err && gzip -t "$tmp" 2>/tmp/${label}.gz.err; then
              gzip -dc "$tmp" > "$dst"
              echo "$label=OK bytes=$(wc -c < "$dst")" >> decoded-charades/bundle-status.txt
              return 0
            fi
            echo "$label=INVALID" >> decoded-charades/bundle-status.txt
            return 1
          }
          unpack charades/embedded/MainActivity.java.gz.b64 charades/app/src/main/java/com/partycharades/offline/MainActivity.java MainActivity
          if [ ! -s charades/app/src/main/java/com/partycharades/offline/MainActivity.java ]; then
            git show 3592e51cb980e6927dca57c63b06435eb61891a0:charades/embedded/MainActivity.java.gz.b64 > /tmp/MainActivity-good.b64
            if base64 -d /tmp/MainActivity-good.b64 | gzip -dc > charades/app/src/main/java/com/partycharades/offline/MainActivity.java; then
              echo 'MainActivity_RECOVERED_FROM=3592e51cb980e6927dca57c63b06435eb61891a0' >> decoded-charades/bundle-status.txt
            fi
          fi
          unpack charades/embedded/PartyManager.java.gz.b64 charades/app/src/main/java/com/partycharades/offline/PartyManager.java PartyManager
          unpack charades/embedded/topic_seeds.json.gz.b64 charades/app/src/main/assets/topic_seeds.json topic_seeds
          [ -s charades/app/src/main/java/com/partycharades/offline/MainActivity.java ] && cp charades/app/src/main/java/com/partycharades/offline/MainActivity.java decoded-charades/MainActivity.java
          [ -s charades/app/src/main/java/com/partycharades/offline/PartyManager.java ] && cp charades/app/src/main/java/com/partycharades/offline/PartyManager.java decoded-charades/PartyManager.java
          [ -s charades/app/src/main/assets/topic_seeds.json ] && cp charades/app/src/main/assets/topic_seeds.json decoded-charades/topic_seeds.json
          cat decoded-charades/bundle-status.txt

      - name: Upload decoded content audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: charades-decoded-content
          path: decoded-charades
          if-no-files-found: error

      - name: Restore stable signing key
        if: ${{ hashFiles('charades/app/src/main/java/com/partycharades/offline/MainActivity.java') != '' && hashFiles('charades/app/src/main/java/com/partycharades/offline/PartyManager.java') != '' && hashFiles('charades/app/src/main/assets/topic_seeds.json') != '' }}
        run: |
          mkdir -p "$HOME/.android"
          base64 -d charades/signing/debug.keystore.b64 > "$HOME/.android/debug.keystore"

      - name: Build APK
        if: ${{ hashFiles('charades/app/src/main/java/com/partycharades/offline/MainActivity.java') != '' && hashFiles('charades/app/src/main/java/com/partycharades/offline/PartyManager.java') != '' && hashFiles('charades/app/src/main/assets/topic_seeds.json') != '' }}
        working-directory: charades
        run: gradle :app:assembleDebug

      - name: Upload APK
        if: ${{ hashFiles('charades/app/build/outputs/apk/debug/app-debug.apk') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: PartyCharades-PR-debug-apk
          path: charades/app/build/outputs/apk/debug/app-debug.apk
