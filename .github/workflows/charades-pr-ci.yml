name: Party Charades PR Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-charades:
    if: ${{ startsWith(github.head_ref, 'charades') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Ensure Android SDK 35
        run: yes | sdkmanager --licenses >/dev/null || true; sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack Charades sources and explicit cards
        shell: bash
        run: |
          mkdir -p charades/app/src/main/java/com/partycharades/offline charades/app/src/main/assets decoded-charades
          base64 -d charades/embedded/MainActivity.java.gz.b64 | gzip -dc > charades/app/src/main/java/com/partycharades/offline/MainActivity.java
          base64 -d charades/embedded/PartyManager.java.gz.b64 | gzip -dc > charades/app/src/main/java/com/partycharades/offline/PartyManager.java
          cat \
            charades/embedded/v2/topic_cards.part00 \
            charades/embedded/v2/topic_cards.part01 \
            charades/embedded/v2/topic_cards.part02 \
            charades/embedded/v2/topic_cards.part03 \
            charades/embedded/v2/topic_cards.part04a \
            charades/embedded/v2/topic_cards.part04b \
            charades/embedded/v2/topic_cards.part05a \
            charades/embedded/v2/topic_cards.part05b1 \
            charades/embedded/v2/topic_cards.part05b2 \
            | base64 -d | gzip -dc > charades/app/src/main/assets/topic_seeds.json
          test -s charades/app/src/main/java/com/partycharades/offline/MainActivity.java
          test -s charades/app/src/main/java/com/partycharades/offline/PartyManager.java
          test -s charades/app/src/main/assets/topic_seeds.json

      - name: Audit clean word bank
        run: |
          python3 charades/scripts/generate_clean_cards.py charades/app/src/main/assets/topic_seeds.json charades/app/src/main/assets/topic_seeds.json | tee decoded-charades/content-audit.txt
          cp charades/app/src/main/java/com/partycharades/offline/MainActivity.java decoded-charades/MainActivity.java
          cp charades/app/src/main/assets/topic_seeds.json decoded-charades/topic_cards.json
          python3 - <<'PY'
          import json,collections
          d=json.load(open('charades/app/src/main/assets/topic_seeds.json',encoding='utf-8'))
          assert len(d)==50
          assert sum(len(t['cards']) for t in d)==4851
          assert min(len(t['cards']) for t in d)>=80
          for t in d:
              assert len({c['text'].casefold() for c in t['cards']})==len(t['cards'])
              n=collections.Counter(c['difficulty'] for c in t['cards'])
              assert all(n[x]>0 for x in ('Easy','Normal','Hard'))
          print('FULL CARD AUDIT PASSED: explicit cards only')
          PY

      - name: Upload decoded content audit
        uses: actions/upload-artifact@v4
        with:
          name: charades-decoded-content-v2
          path: decoded-charades
          if-no-files-found: error

      - name: Restore stable signing key
        run: |
          mkdir -p "$HOME/.android"
          base64 -d charades/signing/debug.keystore.b64 > "$HOME/.android/debug.keystore"

      - name: Build APK
        working-directory: charades
        run: gradle :app:assembleDebug

      - name: Verify APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 charades/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose charades/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging charades/app/build/outputs/apk/debug/app-debug.apk | grep "package: name='com.partycharades.offline'"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PartyCharades-mixed-clean-apk
          path: charades/app/build/outputs/apk/debug/app-debug.apk
