name: Build Party Charades APK

on:
  push:
    branches: [charades-build-v1]
    paths-ignore:
      - 'charades/build-output/**'
      - 'charades/signing/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Ensure Android SDK 35
        run: yes | sdkmanager --licenses >/dev/null || true; sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack offline sources
        run: |
          mkdir -p charades/app/src/main/java/com/partycharades/offline charades/app/src/main/assets
          base64 -d charades/embedded/MainActivity.java.gz.b64 | gzip -dc > charades/app/src/main/java/com/partycharades/offline/MainActivity.java
          base64 -d charades/embedded/PartyManager.java.gz.b64 | gzip -dc > charades/app/src/main/java/com/partycharades/offline/PartyManager.java
          base64 -d charades/embedded/topic_seeds.json.gz.b64 | gzip -dc > charades/app/src/main/assets/topic_seeds.json
          test -s charades/app/src/main/java/com/partycharades/offline/MainActivity.java
          test -s charades/app/src/main/assets/topic_seeds.json

      - name: Restore stable test signing key
        run: |
          if [ -f charades/signing/debug.keystore ]; then
            mkdir -p "$HOME/.android"
            cp charades/signing/debug.keystore "$HOME/.android/debug.keystore"
          fi

      - name: Build installable APK
        working-directory: charades
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PartyCharades-v1-debug-apk
          path: charades/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Save APK and signing key on build branch
        run: |
          mkdir -p charades/build-output charades/signing
          cp charades/app/build/outputs/apk/debug/app-debug.apk charades/build-output/PartyCharades-v1-debug.apk
          if [ ! -f charades/signing/debug.keystore ]; then
            cp "$HOME/.android/debug.keystore" charades/signing/debug.keystore
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add charades/build-output/PartyCharades-v1-debug.apk charades/signing/debug.keystore
          if ! git diff --cached --quiet; then
            git commit -m 'Build Party Charades v1 APK [skip ci]'
            git push
          fi
