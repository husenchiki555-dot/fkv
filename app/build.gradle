plugins {
    id 'com.android.application'
}

android {
    namespace 'com.huseyn.elixircollector'
    compileSdk 35

    defaultConfig {
        applicationId 'com.huseyn.elixircollector'
        minSdk 23
        targetSdk 35
        versionCode 610
        versionName '6.1.0'

        testInstrumentationRunner 'android.app.InstrumentationTestRunner'
    }

    signingConfigs {
        release {
            storeFile file('release-key.jks')
            storePassword 'collector2026'
            storeType 'JKS'
            keyAlias 'elixircollector'
            keyPassword 'collector2026'
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
            enableV4Signing false
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
