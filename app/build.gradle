plugins {
    id 'com.android.application'
}

android {
    namespace 'com.huseyn.elixircollector'
    compileSdk 35

    defaultConfig {
        applicationId 'com.huseyn.elixircollector'
        minSdk 23
        targetSdk 35
        versionCode 400
        versionName '4.0.0'
    }

    signingConfigs {
        release {
            storeFile file('release-key.jks')
            storePassword 'collector2026'
            storeType 'JKS'
            keyAlias 'elixircollector'
            keyPassword 'collector2026'
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
            enableV4Signing false
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
